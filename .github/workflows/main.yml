name: Trigger E2E Tests on Push

on:
  push:
    branches: [ main, staging ]

jobs:
  trigger-playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch E2E Test Suite
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/IonutSavinuC/playwright-enterprise-crm/dispatches \
            -d '{"event_type":"run-e2e-tests"}'

